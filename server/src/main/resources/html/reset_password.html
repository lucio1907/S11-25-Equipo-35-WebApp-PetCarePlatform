<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 1rem;
            margin-top: 0;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        /* --- NUEVOS ESTILOS PARA EL OJO --- */
        .input-wrapper {
            position: relative;
            width: 100%;
            margin: 8px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            /* Dejamos espacio a la derecha para el icono del ojo */
            padding-right: 45px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
            margin: 0;
            /* El margen lo maneja el wrapper ahora */
        }

        input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* Estilo del icono del ojo */
        .toggle-password {
            position: absolute;
            right: 5%;
            top: 5%;
            width: 10%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
        }

        .toggle-password:hover {
            color: #333;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        #success-view {
            display: none;
        }

        .success-icon {
            font-size: 50px;
            color: #4CAF50;
            margin-bottom: 15px;
        }

        .success-title {
            color: #4CAF50;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div id="initial-view">
            <h2>Nueva Contraseña</h2>
            <p class="subtitle">Introduce tu nueva contraseña para PetHealthTracker.</p>

            <form id="resetForm">

                <div class="input-wrapper">
                    <input type="password" id="newPassword" placeholder="Nueva contraseña" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="eye-icon">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required
                        minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="eye-icon">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <button type="submit" id="btnSubmit">CAMBIAR CONTRASEÑA</button>
                <div id="errorBox" class="error-msg"></div>
            </form>
        </div>

        <div id="success-view">
            <div class="success-icon">✓</div>
            <div class="success-title">¡Excelente!</div>
            <p>Contraseña actualizada con éxito.</p>
            <p style="color: #666; font-size: 0.9rem;">Ya puedes volver a la App e iniciar sesión.</p>
        </div>

    </div>

    <script>
        // --- Lógica para mostrar/ocultar contraseña ---
        function togglePassword(inputId, btnElement) {
            const input = document.getElementById(inputId);
            const iconSvg = btnElement.querySelector('svg');

            if (input.type === "password") {
                input.type = "text";
                // Cambiar icono a Ojo Abierto
                iconSvg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            } else {
                input.type = "password";
                // Cambiar icono a Ojo Tachado (Cerrado)
                iconSvg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            }
        }

        // --- Lógica del formulario existente ---
        const form = document.getElementById('resetForm');
        const errorBox = document.getElementById('errorBox');
        const btnSubmit = document.getElementById('btnSubmit');
        const initialView = document.getElementById('initial-view');
        const successView = document.getElementById('success-view');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            // Limpiar errores previos
            errorBox.style.display = 'none';
            errorBox.innerText = "";

            // 1. Validar coincidencia
            if (password !== confirm) {
                showError("Las contraseñas no coinciden.");
                return;
            }

            // 2. Obtener token
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showError("Token inválido o enlace roto.");
                return;
            }

            // Bloquear botón
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Procesando...";

            try {
                const response = await fetch(`/api/auth/reset-password?token=${token}&newPassword=${password}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    initialView.style.display = 'none';
                    successView.style.display = 'block';
                } else {
                    const data = await response.json();
                    showError(data.message || "Error al actualizar la contraseña.");
                    resetButton();
                }
            } catch (error) {
                showError("No se pudo conectar con el servidor.");
                resetButton();
            }
        });

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        }

        function resetButton() {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "CAMBIAR CONTRASEÑA";
        }
    </script>
</body>

</html>
